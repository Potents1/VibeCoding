<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Maze Chase</title>
    <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
    <main class="game-shell">
        <h1>Neon Maze Chase</h1>
        <div id="hud">
            <div>Score: <strong id="scoreValue">0</strong></div>
            <div>Lives: <strong id="livesValue">3</strong></div>
            <div>Status: <strong id="statusValue">Ready</strong></div>
        </div>
        <canvas id="gameCanvas" width="448" height="288"></canvas>
        <p class="hint">Use arrow keys or WASD to guide Pac-Man. Press Enter to restart.</p>
        <button id="restartButton" type="button">Restart</button>
    </main>
    <script type="module" src="./src/game.js"></script>
</body>
</html>
