[project]
name = "cli-calculator"
version = "0.1.0"
description = "Tiny CLI calculator demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calc = "src.calculator:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
