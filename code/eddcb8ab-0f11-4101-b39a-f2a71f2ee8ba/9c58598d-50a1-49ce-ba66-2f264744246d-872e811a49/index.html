<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uplink Runner</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="shell" aria-label="Uplink Runner game">
      <section class="hud" aria-live="polite">
        <div>
          <span class="label">Uplink Runner</span>
          <strong id="status">Collect every charge and reach the uplink.</strong>
        </div>
        <div class="stats">
          <span id="charge-count">0 / 3</span>
          <span id="move-count">0 moves</span>
        </div>
      </section>

      <canvas id="game-canvas" width="672" height="576" aria-label="Game board"></canvas>

      <nav class="controls" aria-label="Movement controls">
        <button type="button" data-dir="left" aria-label="Move left">&#8592;</button>
        <button type="button" data-dir="up" aria-label="Move up">&#8593;</button>
        <button type="button" data-dir="down" aria-label="Move down">&#8595;</button>
        <button type="button" data-dir="right" aria-label="Move right">&#8594;</button>
        <button type="button" id="reset">Reset</button>
      </nav>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
