<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Chess Game</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main id="game-container">
    <h1>Browser Chess Game</h1>
    <div id="board"></div>
    <canvas id="game-canvas" width="640" height="720"></canvas>
    <div id="status" aria-live="polite" role="status"></div>
    <button id="newGame" type="button">Restart</button>
      <label for="aiToggle"><input id="aiToggle" type="checkbox" /> Ai Toggle</label>
      <div id="captured"></div>
      <div id="moves" class="notation" aria-live="polite"></div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
