<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mini-wolf3d</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="stack">
      <div class="topbar">
        <div class="title">MINI WOLF3D</div>
