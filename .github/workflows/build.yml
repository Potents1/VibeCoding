name: Build Package

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".vscode/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  package:
    name: Build deployable package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal build deps
        run: |
          python -m pip install --upgrade pip

      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          release_id="$(date +%Y%m%d%H%M%S)-${short_sha}"
          artifact_name="agi-package-${release_id}"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Assemble package
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "package"
          archive_base = dist / "${{ steps.meta.outputs.artifact_name }}"

          if package.exists():
              shutil.rmtree(package)
          package.mkdir(parents=True)

          ignored_dirs = {".git", ".github", "venv", "__pycache__", ".pytest_cache", ".ruff_cache", "node_modules"}
          ignored_files = {".pyc"}
          ignored_path_prefixes = {Path("logs"), Path("agent-dashboard") / "node_modules"}

          def should_skip(path: Path) -> bool:
              rel = path.relative_to(root)
              if any(part in ignored_dirs for part in rel.parts):
                  return True
              if any(rel == prefix or prefix in rel.parents for prefix in ignored_path_prefixes):
                  return True
              if len(rel.parts) == 2 and rel.parts[0] == "data" and path.suffix == ".db":
                  return True
              return path.suffix in ignored_files

          for source in root.rglob("*"):
              if source == dist or dist in source.parents or should_skip(source):
                  continue
              target = package / source.relative_to(root)
              if source.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)

          shutil.make_archive(str(archive_base), "zip", package)

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/${{ steps.meta.outputs.artifact_name }}.zip
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Build Package Summary"
            echo ""
            echo "- Release ID: ${{ steps.meta.outputs.release_id }}"
            echo "- Artifact: ${{ steps.meta.outputs.artifact_name }}"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
