name: Fullstack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

  workflow_call:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      go: ${{ steps.detect.outputs.go }}
      rust: ${{ steps.detect.outputs.rust }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      java: ${{ steps.detect.outputs.java }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        shell: bash
        run: |
          has() { find . -path './.git' -prune -o -path './documents/*' -prune -o -path './run_artifacts/*' -prune -o -path '*/node_modules/*' -prune -o -name "$1" -print -quit | grep -q .; }

          echo "node=$(has package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$((has pyproject.toml || has requirements.txt || has setup.py) && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$(has go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$(has Cargo.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dotnet=$((has '*.csproj' || has '*.sln') && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "java=$((has pom.xml || has build.gradle || has build.gradle.kts) && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Test Node projects
        shell: bash
        run: |
          while IFS= read -r pkg; do
            dir="$(dirname "$pkg")"
            echo "::group::Node checks: $dir"
            cd "$dir"
            if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
            npm test --if-present
            npm run lint --if-present
            npm run build --if-present
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done < <(find . -path './documents/*' -prune -o -path './run_artifacts/*' -prune -o -path '*/node_modules/*' -prune -o -name package.json -print)

      - name: Upload JS artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: node-artifacts
          path: |
            **/dist/**
            **/build/**
            **/coverage/**
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python projects
        shell: bash
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          [ -f pyproject.toml ] && pip install -e . || true
          mapfile -t py_tests < <(find . -path './.git' -prune -o -path './documents/*' -prune -o -path './run_artifacts/*' -prune -o -path '*/node_modules/*' -prune -o -path '*/tests/*.py' -print)
          if [ "${#py_tests[@]}" -gt 0 ]; then
            python -m pip install pytest
            pytest_targets=()
            smoke_targets=()
            for test_file in "${py_tests[@]}"; do
              case "$(basename "$test_file")" in
                test_*.py|*_test.py) pytest_targets+=("$test_file") ;;
                *) smoke_targets+=("$test_file") ;;
              esac
            done
            if [ "${#pytest_targets[@]}" -gt 0 ]; then pytest -q "${pytest_targets[@]}"; fi
            for smoke_file in "${smoke_targets[@]}"; do python "$smoke_file"; done
          else
            echo "No Python tests found."
          fi

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --all

  codeql-js:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  codeql-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
